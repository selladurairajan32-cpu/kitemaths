name: CI

on:
  pull_request:
  push:
    # QA-006: development branches get the same checks as main, so every pushed commit has a hosted run.
    branches: [main, "claude/**"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit, content and component tests
        run: npm test
      - name: Lint
        run: npm run lint
      # PageProps and LayoutProps are generated by Next (next typegen), so make them before type-checking.
      - name: Type check
        run: npx next typegen && npx tsc --noEmit -p .
      - name: Build
        run: npm run build
