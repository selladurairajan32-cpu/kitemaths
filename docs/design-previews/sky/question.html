<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Kite Maths · Question</title><style>
@import url('../fonts/Baloo2.css');
@import url('../fonts/Nunito.css');
:root{
  /* type: one display face for headings, numbers and buttons; one text face for reading */
  --display:'Baloo 2',ui-rounded,system-ui,sans-serif;
  --text:'Nunito',ui-rounded,system-ui,sans-serif;
  --t-hero:76px;--t-h2:46px;--t-h3:26px;--t-body:19px;--t-small:15px;
  /* colour */
  --sky:#5ebfff;--sky-pale:#eaf6ff;--sky-ink:#0f5fa8;
  --navy:#0f2240;--navy-2:#34486b;--muted:#5a6a85;--line:#dbe7f3;
  --red:#ec3a3a;--red-edge:#b3201f;
  --sun:#ffcc33;--sun-soft:#fff1c2;--sun-ink:#7a5200;
  --grass:#2fbf71;--grass-back:#8ddc8f;--ok-soft:#ddf7e8;--ok-ink:#13663e;
  --coral-soft:#ffe3de;--night:#0f2240;--night-2:#1c355b;
  /* shape */
  --r-panel:28px;--r-tile:20px;
  --shadow:0 18px 44px rgba(15,34,64,.10);--shadow-sm:0 8px 22px rgba(15,34,64,.08);
  /* the app's own paper colours, used by Kip and the drawings */
  --color-ink:#13203a;--color-ink-2:#2e3a52;--color-muted:#56627b;--color-kite-red:#e8343f;--color-sun:#ffc23d;--color-sun-strong:#d99a00;
  --color-sun-soft:#fff4d4;--color-sky:#4da8f0;--color-sky-soft:#d6ecfd;--color-leaf:#3dae6b;--color-leaf-soft:#dcf3e5;
  --color-num:#f4623a;--color-num-strong:#a3361a;--color-num-soft:#fde5dc;--color-den:#2f6fd8;--color-den-soft:#dfeafb;
  --color-ok-bright:#2e9d61;--color-surface:#fff;--color-line:#d3e1ef;--color-sunk:#eaf1f8;--color-raised:#f4f9fe;--color-brand-soft:#fbe1e3;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--text);font-size:var(--t-body);line-height:1.55;color:var(--navy);background:#fff;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
a{color:inherit}
:focus-visible{outline:3px solid var(--navy);outline-offset:3px;border-radius:14px}
.wrap{max-width:1200px;margin:0 auto;padding:0 32px}
h1,h2,h3,.d{font-family:var(--display);font-weight:800;letter-spacing:-.01em;margin:0;color:var(--navy)}
h1{font-size:var(--t-hero);line-height:.98}
h2{font-size:var(--t-h2);line-height:1.02}
h3{font-size:var(--t-h3);line-height:1.1}
p{margin:0}
.small{font-size:var(--t-small);font-weight:700;color:var(--muted)}

/* buttons: one family, pill shaped, with a tactile edge */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:60px;padding:0 30px;border-radius:999px;border:0;font-family:var(--display);font-weight:800;font-size:23px;text-decoration:none;cursor:pointer;transition:transform .08s,box-shadow .08s;white-space:nowrap}
.btn svg{width:22px;height:22px}
.btn.red{background:var(--red);color:#fff;box-shadow:0 6px 0 var(--red-edge)}
.btn.white{background:#fff;color:var(--navy);box-shadow:0 6px 0 #c4d6ea}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--red-edge)}
.btn.sm{height:48px;font-size:19px;padding:0 22px}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:999px;font-weight:800;font-size:14px;white-space:nowrap}
.chip svg{width:16px;height:16px}

/* fraction notation */
.frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1;font-family:var(--display);font-weight:800;vertical-align:middle;margin:0 .08em}
.frac .fn{color:var(--color-num-strong);padding:0 .14em .06em;border-bottom:.1em solid var(--color-ink)}
.frac .fd{color:var(--color-den);padding-top:.04em}

/* ---------- 1. the sky ---------- */
.sky{position:relative;background:var(--sky);overflow:hidden}
.topbar{position:relative;z-index:5;display:flex;align-items:center;gap:22px;height:84px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:27px;text-decoration:none;color:var(--navy)}
.logo svg{width:38px;height:38px}
.links{display:flex;gap:4px;margin-left:24px}
.links a{display:flex;align-items:center;gap:8px;height:46px;padding:0 18px;border-radius:999px;font-weight:800;font-size:17px;text-decoration:none;color:var(--navy)}
.links a svg{width:20px;height:20px}
.links a.on{background:#fff}
.me{margin-left:auto;display:flex;align-items:center;gap:10px}
.pillstat{display:flex;align-items:center;gap:6px;height:46px;padding:0 16px 0 10px;border-radius:999px;background:rgba(255,255,255,.92);font-family:var(--display);font-weight:800;font-size:21px}
.pillstat svg{width:28px;height:28px}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:21px;text-decoration:none}
.hero{position:relative;z-index:3;display:grid;grid-template-columns:560px 1fr;gap:24px;padding:36px 0 196px;min-height:600px}
.hello{font-family:var(--display);font-weight:700;font-size:24px;color:var(--navy-2);margin-bottom:6px}
.mission{margin-top:30px;background:#fff;border-radius:var(--r-panel);box-shadow:var(--shadow);padding:24px 26px 26px;display:grid;grid-template-columns:auto 1fr;gap:4px 18px}
.mission .ic{grid-row:span 2;width:76px;height:76px;border-radius:50%;background:var(--sky-pale);display:grid;place-items:center}
.mission .k{font-weight:800;font-size:15px;color:var(--sky-ink)}
.mission h3{font-size:30px}
.mission .bar{grid-column:1/-1;margin-top:16px}
.mission .go{grid-column:1/-1;display:flex;align-items:center;gap:18px;margin-top:20px}
.reward{display:inline-flex;align-items:center;gap:6px;font-weight:800;color:var(--sun-ink)}
.reward svg{width:24px;height:24px}
.bar{height:14px;border-radius:99px;background:#e8eff7;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--grass)}
.barlabel{display:flex;justify-content:space-between;margin-top:8px;font-size:var(--t-small);font-weight:700;color:var(--muted)}
.scene{position:absolute;inset:0;pointer-events:none}
.sun{position:absolute;right:6%;top:96px;width:340px;height:340px;border-radius:50%;background:var(--sun)}
.sun::after{content:'';position:absolute;inset:-34px;border-radius:50%;background:rgba(255,224,120,.35)}
.scene .cl{position:absolute}
.flyer{position:absolute;right:20%;top:120px;width:230px;transform:rotate(-8deg)}
.flyer .kip{width:100%;height:auto;display:block;overflow:visible}
.hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:230px}
.heroart{display:none}

/* ---------- 2. flight deck ---------- */
.deck{position:relative;z-index:4;margin-top:-118px}
.deckcard{background:#fff;border-radius:var(--r-panel);box-shadow:var(--shadow);display:grid;grid-template-columns:1.5fr 1fr 1.35fr 1.1fr}
.deckcard > div{padding:26px 28px}
.deckcard > div + div{border-left:2px solid #f0f4f9}
.lab{font-weight:800;font-size:var(--t-small);color:var(--muted)}
.big{font-family:var(--display);font-weight:800;font-size:46px;line-height:1;display:flex;align-items:center;gap:8px;margin-top:6px}
.big svg{width:38px;height:38px}
.big small{font-size:20px;color:var(--muted)}
.alt{position:relative;margin-top:16px;height:14px;border-radius:99px;background:#e8eff7}
.alt i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--sky)}
.alt b{position:absolute;top:50%;transform:translate(-50%,-56%)}
.alt b svg{width:30px;height:30px}
.days{display:flex;gap:8px;margin-top:14px}
.days span{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:#eef3f9;color:var(--muted)}
.days span.lit{background:var(--sun-soft)}
.days span.lit svg{width:22px;height:22px}
.ring{display:flex;align-items:center;gap:14px;margin-top:6px}
.ring svg{width:76px;height:76px}

/* ---------- 3. the island path ---------- */
.island{padding:104px 0 48px}
.sechead{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:12px}
.sechead p{margin-top:10px;font-size:20px;color:var(--navy-2)}
.ghost{display:inline-flex;align-items:center;gap:8px;height:50px;padding:0 22px;border-radius:999px;background:var(--sky-pale);font-weight:800;text-decoration:none;font-size:17px;white-space:nowrap}
.ghost svg{width:20px;height:20px}
.path{position:relative;height:610px;list-style:none;margin:36px 0 0;padding:0}
.path > svg{position:absolute;left:0;top:0;width:100%;height:560px}
.stop{position:absolute;transform:translateX(-50%);width:190px;display:flex;flex-direction:column;align-items:center;text-align:center;text-decoration:none}
.dot{position:relative;width:96px;height:96px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:var(--shadow-sm)}
.dot svg{width:54px;height:54px}
.stop.done .dot{box-shadow:0 0 0 7px var(--grass),var(--shadow-sm)}
.stop.done .dot .tick{position:absolute;right:-8px;top:-8px;width:34px;height:34px;border-radius:50%;background:var(--grass);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 4px #fff}
.stop.done .dot .tick svg{width:18px;height:18px}
.stop.open .dot{box-shadow:0 0 0 5px #dbe7f3}
.stop.open .dot svg{opacity:.55}
.stop.now .dot{width:116px;height:116px;box-shadow:0 0 0 9px var(--red),0 0 0 22px rgba(236,58,58,.14),var(--shadow)}
.stop.now .dot svg{width:64px;height:64px}
.stop.goal .dot{background:var(--sun);box-shadow:0 0 0 6px #ffe08a,var(--shadow-sm)}
.stop .nm{margin-top:14px;font-weight:800;font-size:17px;line-height:1.25;color:var(--navy);background:#fff;border-radius:10px;padding:2px 8px}
.stop.open .nm{color:var(--navy-2)}
.stop .st{margin-top:2px;font-size:14px;font-weight:700;color:var(--muted);background:#fff;border-radius:8px;padding:0 6px}
.stop .play{margin-top:10px}
.pin{position:absolute;top:-92px;left:50%;width:62px;transform:translateX(-12%) rotate(-10deg)}
.pin .kip{width:100%;height:auto;overflow:visible}
.path-v{display:none}

/* ---------- 4. quests ---------- */
.quests{background:var(--sky-pale);padding:96px 0}
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:40px;list-style:none;padding:0}
.quest{border-radius:var(--r-panel);padding:26px 26px 24px;display:flex;flex-direction:column;gap:14px;min-height:250px}
.quest .qi{width:76px;height:76px;border-radius:24px;background:#fff;display:grid;place-items:center}
.quest .qi svg{width:52px;height:52px}
.quest h3{font-size:28px}
.quest .bar{background:rgba(255,255,255,.85);margin-top:auto}
.quest .foot{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:16px}
.quest .prize{display:inline-flex;align-items:center;gap:5px;height:36px;padding:0 14px;border-radius:999px;background:#fff;font-family:var(--display);font-size:18px}
.quest .prize svg{width:22px;height:22px}
.q-sun{background:var(--sun-soft)}
.q-coral{background:var(--coral-soft)}
.q-grass{background:var(--ok-soft)}

/* ---------- 5. the kite shelf, at night ---------- */
.night{position:relative;background:var(--night);color:#fff;padding:96px 0 64px;overflow:hidden}
.night h2{color:#fff}
.night .sechead p{color:#c3d3ea}
.starsbg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.shelf{position:relative;display:grid;grid-template-columns:repeat(7,1fr);gap:18px;margin:44px 0 0;padding:0;list-style:none}
.kt{display:flex;flex-direction:column;align-items:center;text-align:center}
.kt .disc{width:140px;height:156px;border-radius:70px 70px 32px 32px;background:var(--night-2);display:grid;place-items:center}
.kt .disc svg{filter:drop-shadow(0 8px 0 rgba(0,0,0,.18))}
.kt .nm{margin-top:12px;font-family:var(--display);font-weight:800;font-size:20px;line-height:1.1}
.kt .st{margin-top:2px;font-size:14px;font-weight:700;color:#9fb6d6}
.kt.locked .disc{background:transparent;box-shadow:inset 0 0 0 3px #2c4a76}
.kt.locked .nm{color:#c3d3ea}
.ghostkite{width:58px;height:76px}
.minibar{width:96px;height:8px;border-radius:99px;background:#2c4a76;margin-top:8px;overflow:hidden}
.minibar i{display:block;height:100%;background:var(--sun);border-radius:99px}
.kipsays{position:relative;display:flex;align-items:center;gap:16px;margin-top:52px}
.kipsays .kip{width:70px;height:auto;overflow:visible}
.kipsays p{background:#fff;color:var(--navy);border-radius:22px;padding:14px 20px;font-weight:800;font-size:18px;position:relative}
.kipsays p::before{content:'';position:absolute;left:-10px;top:50%;width:20px;height:20px;background:#fff;transform:translateY(-50%) rotate(45deg);border-radius:3px}

.tabbar{display:none}

/* ---------- question screen ---------- */
.qpage{background:var(--sky-pale);min-height:100vh}
.qbar{display:flex;align-items:center;gap:22px;height:88px;max-width:1140px;margin:0 auto;padding:0 32px}
.round{width:50px;height:50px;border-radius:50%;background:#fff;border:0;display:grid;place-items:center;box-shadow:var(--shadow-sm);color:var(--navy);flex:none;cursor:pointer}
.round svg{width:22px;height:22px}
.tail{flex:1;display:flex;align-items:center}
.tail span{flex:1;height:4px;background:#b9cfe6}
.tail svg{flex:none}
.qgridp{max-width:1140px;margin:0 auto;padding:8px 32px 200px;display:grid;grid-template-columns:1fr 300px;gap:36px;align-items:start}
.qcard{background:#fff;border-radius:34px;box-shadow:var(--shadow);padding:34px 38px 36px}
.qchip{background:var(--sky-pale);color:var(--sky-ink)}
.qcard h1{font-size:52px;line-height:1.05;margin:16px 0 8px}
.qcard .sub{font-size:20px;color:var(--navy-2);font-weight:700}
.qcard h1 .frac{font-size:.78em;margin:-.42em .08em}
.bigbar{display:flex;height:132px;border:5px solid var(--color-ink);border-radius:22px;overflow:hidden;margin:30px 0 16px}
.bigbar i{flex:1;border-right:5px solid var(--color-ink);background:#fff}
.bigbar i:last-child{border-right:0}
.bigbar i.on{background:var(--color-num)}
.count{text-align:center;font-family:var(--display);font-weight:800;font-size:22px;color:var(--navy-2)}
.count b{color:var(--color-num-strong)}
.qactions{display:flex;align-items:center;justify-content:space-between;margin-top:28px}
.textbtn{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 6px;border:0;background:none;font-family:var(--text);font-weight:800;font-size:18px;color:var(--navy-2);cursor:pointer}
.textbtn svg{width:20px;height:20px}
.helper{position:sticky;top:20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:left}
.helper .kip{width:150px;height:auto;overflow:visible}
.bubble{position:relative;background:#fff;border-radius:26px;padding:20px 22px;box-shadow:var(--shadow-sm);font-size:18px;font-weight:700;color:var(--navy-2)}
.bubble::before{content:'';position:absolute;left:50%;top:-10px;width:22px;height:22px;background:#fff;transform:translateX(-50%) rotate(45deg);border-radius:4px}
.bubble b{display:block;font-family:var(--display);font-size:22px;color:var(--navy);margin-bottom:4px}
.helper .btn{width:100%}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ok-soft);box-shadow:0 -12px 40px rgba(15,34,64,.12)}
.sheet .in{max-width:1140px;margin:0 auto;padding:26px 32px 30px;display:grid;grid-template-columns:120px 1fr auto;gap:24px;align-items:center}
.sheet .kip{width:120px;height:auto;overflow:visible;margin-top:-64px}
.sheet h2{color:var(--ok-ink);display:flex;align-items:center;gap:14px;font-size:44px}
.sheet .plus{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 16px;border-radius:999px;background:#fff;color:var(--navy);font-size:24px}
.sheet .plus svg{width:26px;height:26px}
.sheet p{margin-top:6px;font-size:20px;font-weight:700;color:#1f4a33}
.confetti{position:absolute;left:0;right:0;top:-70px;height:70px;width:100%;pointer-events:none}

@media (max-width:1180px){.links a span{display:none}.links{margin-left:4px}.shelf{grid-template-columns:repeat(4,1fr);row-gap:28px}}
@media (max-width:980px){
  .hero{grid-template-columns:1fr;padding-bottom:260px}
  .deckcard{grid-template-columns:1fr 1fr}
  .deckcard > div:nth-child(3){border-left:0;border-top:2px solid #f0f4f9}
  .deckcard > div:nth-child(4){border-top:2px solid #f0f4f9}
  .qgrid{grid-template-columns:1fr}
  .qgridp{grid-template-columns:1fr}
  .helper{position:static;flex-direction:row;align-items:center}
  .helper .kip{width:84px}
  .helper .btn{width:auto}
}
@media (max-width:860px){
  .path-h{display:none}
  .path-v{display:block;position:relative;list-style:none;margin:28px 0 0;padding:0}
  .path-v > svg{position:absolute;left:0;top:0;width:100%}
  .path-v .stop{width:150px}
  .path-v .pin{top:4px;left:auto;right:-62px;transform:rotate(10deg);width:54px}
}
@media (max-width:640px){
  :root{--t-hero:46px;--t-h2:34px;--t-h3:22px;--t-body:17px;--t-small:14px}
  body{padding-bottom:86px}
  .wrap{padding:0 18px}
  .topbar{height:68px;gap:10px}
  .links,.avatar{display:none}
  .logo{font-size:23px}.logo svg{width:32px;height:32px}
  .pillstat{height:40px;font-size:18px;padding:0 12px 0 8px}.pillstat svg{width:24px;height:24px}
  .hero{padding:14px 0 0;min-height:0;display:block}
  .hello{font-size:19px}
  .heroart{display:block;position:relative;height:300px;margin:4px -18px 0}
  .sky > .hills{display:none}
  .heroart .sun{width:190px;height:190px;right:8%;top:28px}
  .heroart .sun::after{inset:-20px}
  .heroart .flyer{width:130px;right:20%;top:30px}
  .heroart .hills{height:120px}
  .mission{margin-top:-74px;position:relative;z-index:4;padding:18px 18px 20px;gap:2px 14px}
  .mission .ic{width:60px;height:60px}.mission .ic svg{width:40px;height:40px}
  .mission h3{font-size:24px}
  .mission .go{flex-wrap:wrap;gap:10px 14px}
  .mission .go .btn{flex:1}
  .sky .scene.desk{display:none}
  .deck{margin-top:24px}
  .deckcard{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .deckcard > div{padding:18px 16px;border:0!important;border-top:2px solid #f0f4f9!important}
  .deckcard > div:nth-child(1){grid-column:1/-1;border-top:0!important}
  .deckcard > div:nth-child(2){order:2}
  .deckcard > div:nth-child(4){order:3;border-left:2px solid #f0f4f9!important}
  .deckcard > div:nth-child(3){order:4;grid-column:1/-1}
  .big{font-size:36px}.big svg{width:30px;height:30px}
  .days{gap:4px}.days span{width:26px;height:26px;font-size:11px}.days span.lit svg{width:17px;height:17px}
  .ring svg{width:58px;height:58px}
  .island{padding:64px 0 56px}
  .sechead{flex-direction:column;align-items:flex-start;gap:14px}
  .sechead p{font-size:17px}
  .quests{padding:64px 0}
  .quest{min-height:0;padding:20px}
  .quest h3{font-size:24px}
  .night{padding:64px 0 48px}
  .shelf{grid-template-columns:repeat(3,1fr);gap:22px 10px}
  .kt .disc{width:100px;height:112px;border-radius:50px 50px 24px 24px}
  .kt .disc svg{width:48px;height:72px}
  .kt .nm{font-size:17px}
  .kt:nth-child(n+7){display:none}
  .kipsays{margin-top:40px;align-items:flex-start}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;box-shadow:0 -6px 24px rgba(15,34,64,.10);padding:8px 6px calc(10px + env(safe-area-inset-bottom))}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;font-size:13px;font-weight:800;color:var(--muted)}
  .tabbar a span.t{display:grid;place-items:center;width:58px;height:34px;border-radius:999px}
  .tabbar a.on{color:var(--navy)}.tabbar a.on span.t{background:var(--sky-pale)}
  .tabbar svg{width:23px;height:23px}
  .qbar{height:70px;gap:12px;padding:0 18px}
  .qgridp{padding:4px 18px 300px;gap:18px}
  .qcard{padding:22px 20px 24px;border-radius:28px}
  .qcard h1{font-size:36px}
  .qcard .sub{font-size:17px}
  .bigbar{height:88px;border-width:4px;border-radius:16px;margin:22px 0 12px}
